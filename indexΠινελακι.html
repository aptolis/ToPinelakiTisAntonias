function art(id, stage = 3) {
  const themes = {
    pear:['#e7dfc8','#514b34','Αχλάδι σε πλάγιο φως'],
    eye:['#e9d6c3','#493a32','Μελέτη ανθρώπινου ματιού'],

    feather:['#dfded7','#394347','Φτερό σε λοξό άξονα'],
    jug:['#e7d1bf','#5a4239','Κεραμική κανάτα']
  };
  const [paper, ink, label] = themes[id] || themes.pear;
  art.sequence = (art.sequence || 0) + 1;
  const key = 'sk' + art.sequence;
  const ref = name => 'url(#' + key + name + ')';
  let seed=31821;
  const rand=()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296);
  const n = x => Math.round(x*10)/10;
  const p = (d, w=1.4, opacity=.94, fill='none', extra='') => '<path d="'+d+'" stroke="'+ink+'" stroke-width="'+w+'" opacity="'+opacity+'" fill="'+fill+'" '+extra+'/>';
  const e = (x,y,rx,ry,w=1,opacity=.8,fill='none') => '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+ink+'" stroke-width="'+w+'" opacity="'+opacity+'"/>';
  const repeat=(count,fn)=>Array.from({length:count},(_,i)=>fn(i)).join('');
  let defs='', out='';
  const clip=(name,d,s)=>{defs+='<clipPath id="'+key+name+'"><path d="'+d+'"/></clipPath>'; return '<g clip-path="'+ref(name)+'">'+s+'</g>';};
  const shade=(name,c1,c2,c3)=>{defs+='<linearGradient id="'+key+name+'" x1="0%" y1="25%" x2="95%" y2="75%"><stop stop-color="'+c1+'"/><stop offset=".45" stop-color="'+c2+'"/><stop offset="1" stop-color="'+c3+'"/></linearGradient>'; return ref(name);};
  const guide=d=>p(d,1,stage===0?.52:.15,'none','stroke-dasharray="5 4"');

  if(id==='pear'){
    const body='M233 57C216 54 211 66 207 83C202 106 191 116 176 130C155 151 148 173 155 194C162 215 182 223 207 226C230 230 253 221 267 202C285 179 273 151 259 134C242 113 245 94 246 78C247 67 244 59 233 57Z';

    }

      out+=clip('pearbody',body,hatch(107,208,284,.78,-1.8,24,75)+hatch(48,138,241,2.75,.01,29,33,.75));

      out+=clip('pearspecks',body,repeat(1600,()=>{let x=150+rand()*130,y=53+rand()*175;return e(n(x),n(y),n(.2+rand()*.62),n(.2+rand()*.62),0,.15+rand()*.25,ink);}));

      out+=clip('eyeopen',opening,iris+(stage>=3?repeat(136,i=>{let a=i*.0462,r=18+rand()*12;return p('M'+n(198+Math.cos(a)*r)+' '+n(125+Math.sin(a)*r)+'Q'+n(198+Math.cos(a+.08)*(r+7))+' '+n(125+Math.sin(a+.08)*(r+7))+' '+n(198+Math.cos(a+.03)*38)+' '+n(125+Math.sin(a+.03)*39),.5+rand()*.8,.39+rand()*.42);}):'') );

    if(stage>=3){

      out+=repeat(37,i=>{let t=i/36,x=100+t*218,y=125-38*Math.sin(Math.PI*t)+3*t;return p('M'+n(x)+' '+n(y)+'q'+n(1+t*5)+' '+n(-3-rand()*5)+' '+n(-5+t*16)+' '+n(-8-rand()*9),.7+rand()*.75,.7);});
      out+=repeat(31,i=>{let x=119+i*6,y=159+12*Math.sin(i/30*Math.PI)-i*.7;return p('M'+n(x)+' '+n(y)+'q2 4 6 7',.8,.5);});

  } else if(id==='mountains'){
    const peaks='M-8 160L32 124L48 128L84 97L99 104L148 52L160 66L173 61L207 104L238 76L251 83L274 60L324 111L341 104L408 151V180H-8Z';
    const front='M-5 144Q22 136 54 149T118 154Q145 150 164 157Q194 167 218 163Q242 162 266 151Q291 145 310 145Q343 145 368 129L406 117V181H-5Z';
    if(stage<2)out+=guide('M0 165H400M147 43V173M274 49V171')+p('M0 156L148 52L211 118L274 60L400 150M0 171H400',1,stage===0?.8:.24);
    if(stage>=1)out+=p(peaks,1.45,1,stage>=2?'#bec6b8':'none')+p('M147 53L132 96L122 103L116 124L88 149M173 63L163 86L177 90L179 104L194 119M275 61L269 86L256 100L253 112L227 140',.98,.8);
    if(stage>=2){
      out+=p('M148 53L160 67L173 62L208 105L189 128L170 116L163 95L150 85L139 97Z M275 61L324 111L337 111L340 133L311 143L294 117L279 99L269 87Z',.5,.7,'#7f9087');
      out+=clip('ridge',peaks,hatch(135,5,181,2.9,-.11,19,34,.8));
      out+=p(front,1,.94,'#788a79')+p('M0 174Q120 169 192 173T400 166V250H0Z',0,.52,'#b3c6bf');
    }
    if(stage>=3){
      out+=repeat(170,i=>{let x=i*2.4,y=161+6*Math.sin(x/75)-Math.max(0,x-288)*.24,h=3+rand()*10+Math.max(0,x-318)*.16;return p('M'+n(x)+' '+n(y-h)+'l'+n(-h*.26)+' '+n(h*.77)+'l'+n(h*.13)+' -1l'+n(-h*.22)+' '+n(h*.34)+'h'+n(h*.75)+'l'+n(-h*.24)+' '+n(-h*.38)+'l2 1Z',0,.55+rand()*.35,ink);});
      out+=repeat(125,()=>{let x=rand()*400,y=174+rand()*71,l=2+rand()*36;return p('M'+n(x)+' '+n(y)+'q'+n(l*.45)+' -1 '+n(l)+' -.4',.6,.15+rand()*.4);});
      out+=repeat(95,()=>{let x=70+rand()*126,y=132-rand()*54;return clip('rock'+n(rand()*1e7),peaks,p('M'+n(x)+' '+n(y)+'l-6 8l-4 1l-7 10',.65,.45));});
    }
  } else if(id==='street'){
    const arch='M65 217V111Q69 76 112 48Q157 74 161 111V217H149V113Q146 87 112 62Q80 86 78 113V217Z';
    if(stage<2)out+=guide('M0 136H400M4 229L233 136L400 230M0 19L233 136L400 36M233 109V155')+p('M0 249L233 136L400 245M0 8L233 136L400 50',.8,.6);
    if(stage>=1)out+=p('M0 5L179 84V158L0 230Z',1.6,1,stage>=2?'#cdb798':'none')+p('M400 33L274 99V159L400 235Z',1.6,1,stage>=2?'#c5a98d':'none')+p('M179 84L201 97V150L179 158ZM274 99L251 111V147L274 159Z',1,.82,stage>=2?'#d6c5ac':'none')+p('M0 231L232 136L400 236',1,.75);
    if(stage>=1)out+=p('M75 201V111Q78 80 112 58Q148 83 151 113V169Z',1.4,.95,stage>=2?'#6d6053':'none')+p(arch,1.6,1,stage>=2?'#e3ceb0':'none');

      out+=p('M0 19L178 90M1 27L178 94M0 198L69 176M162 148L177 144M275 106L400 49M276 110L400 59',1.2,.8);
      out+=repeat(5,i=>{let x=284+i*23,y=111-i*8,w=4+i*1.2,h=12+i*3;return p('M'+x+' '+y+'l'+n(w)+' '+n(-w*.4)+'v'+h+'l'+n(-w)+' '+n(w*.2)+'Z',1,.85,'#746354');});
      out+=p('M20 80L43 87V131L20 131Z M185 107L193 110V126L185 126Z',1,.85,'#786656');
    }
    if(stage>=3){
      out+=clip('archstone',arch,repeat(11,i=>{let a=Math.PI+(i/10)*Math.PI;return p('M'+n(112+Math.cos(a)*28)+' '+n(116+Math.sin(a)*49)+'L'+n(112+Math.cos(a)*60)+' '+n(116+Math.sin(a)*83),1,.8);})+repeat(8,i=>p('M60 '+(117+i*16)+'l26 3m57 -4l20 4',1,.8)));
      out+=repeat(9,i=>{let y=23+i*21;return p('M0 '+y+'L64 '+n(y*.71+136*.29)+'M166 '+n(y*.28+136*.72)+'l10 '+n((136-y)*.04),.65,.45);});
      out+=repeat(9,i=>{let y=144+Math.pow(i,1.72)*2.7;return p('M'+n(Math.max(0,233-(y-136)*2.45))+' '+n(y)+'q75 3 '+n((y-136)*4.15)+' 0',.8,.46);});
      out+=repeat(62,()=>{let x=rand()*400,y=201+rand()*47;return p('M'+n(x)+' '+n(y)+'l6 -.5',.65,.36);});

  } else {
    const vessel='M151 48Q180 40 209 47L232 45L220 58Q208 67 214 91C219 109 249 122 252 155C255 183 238 203 224 216Q219 224 219 229Q185 239 151 229Q152 220 140 211C117 189 111 163 119 143C128 121 149 110 154 93Q162 70 151 48Z';

    if(stage>=3){
